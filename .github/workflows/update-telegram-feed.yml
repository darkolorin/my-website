name: Update Telegram feed

on:
  workflow_dispatch:
    inputs:
      import_history:
        description: Translate missing posts from the captured full public history
        type: boolean
        default: false
  schedule:
    # Every 6 hours
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-telegram-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Require a feature branch for the full history import
        if: github.event_name == 'workflow_dispatch' && inputs.import_history
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          case "$TARGET_REF" in
            refs/heads/main) echo "Run the full history import on a feature branch for review before publishing."; exit 1 ;;
            refs/heads/*) ;;
            *) echo "The full history import requires a branch, not a tag."; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Import full Telegram history (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.import_history
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python -u scripts/import_telegram_history.py --input data/telegram-history.json --archive archive.json --checkpoint data/telegram-history-translations.json --workers 4

      - name: Generate feed.json
        env:
          # Optional: add OPENAI_API_KEY (and optionally OPENAI_MODEL) as repo secrets
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/update_telegram_feed.py --channel chillhousetech --limit 25 --out feed.json --translator auto

      - name: Build permanent archive and RSS
        run: python scripts/build_archive.py --feed feed.json --archive archive.json --output-dir .

      - name: Commit and push (if changed)
        if: success() || (failure() && github.event_name == 'workflow_dispatch' && inputs.import_history && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add feed.json archive.json essays.html posts/ rss.xml sitemap.xml data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Telegram feed and archive"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"


